# AI基金分析助手 Docker Compose 配置

services:
  fund-analyzer:
    build: .
    container_name: ai-fund-analyzer
    ports:
      - "8000:8000"   # FastAPI
      - "8501:8501"   # Streamlit UI
    volumes:
      - ./data:/app/data       # 数据持久化
      - ./reports:/app/reports # 报告持久化
      - ./.env:/app/.env       # 环境变量
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
